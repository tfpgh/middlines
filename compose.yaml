x-shared-environment: &shared-environment
  TZ: America/New_York

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    environment:
      <<: *shared-environment

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    mem_limit: 4g
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/low-memory.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    environment:
      <<: *shared-environment
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  clickhouse-migrate:
    build: ./clickhouse
    profiles:
      - tools
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GOOSE_DRIVER: clickhouse
      GOOSE_DBSTRING: tcp://clickhouse:9000/default
      GOOSE_MIGRATION_DIR: /migrations
    command: ["status"]

  api:
    build: ./services/api
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - ./data:/data
    environment:
      <<: *shared-environment
      MIDDLINES_ADMIN_USERNAME: ${MIDDLINES_ADMIN_USERNAME:-admin}
      MIDDLINES_ADMIN_PASSWORD: ${MIDDLINES_ADMIN_PASSWORD:-changeme}
      MIDDLINES_SESSION_SECRET: ${MIDDLINES_SESSION_SECRET:-dev-session-secret}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      <<: *shared-environment

  nginx-proxy:
    image: nginx:1.29-trixie
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-proxy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_started
    environment:
      <<: *shared-environment
